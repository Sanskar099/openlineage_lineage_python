[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlineage-lineage-python"
version = "0.1.0"
description = "Derive SQL column lineage and emit OpenLineage events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openlineage-python>=1.35",
    "pytest>=9.2.0",
    "sqlglot>=26,<31",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
lineage-generate = "lineage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
